<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VCT 2025 — Data Dashboard</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #0D1117;
    --card:    #161B22;
    --border:  #30363D;
    --red:     #EF5350;
    --blue:    #42A5F5;
    --green:   #66BB6A;
    --yellow:  #FFA726;
    --text:    #FFFFFF;
    --muted:   #8B949E;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px; background: var(--card); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 1.1rem; letter-spacing: .06em; color: var(--red); font-weight: 700; }
  header span { color: var(--muted); font-size: .85rem; }
  #clear-btn {
    background: transparent; border: 1px solid var(--red); color: var(--red);
    padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: .85rem; transition: background .2s;
  }
  #clear-btn:hover { background: var(--red); color: #fff; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 12px; padding: 12px; height: calc(100vh - 57px);
  }
  .panel {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    display: flex; flex-direction: column; overflow: hidden; min-height: 340px;
  }
  .panel-title {
    padding: 10px 16px; font-size: .78rem; font-weight: 600; letter-spacing: .08em;
    color: var(--muted); border-bottom: 1px solid var(--border); text-transform: uppercase;
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  #variance-info {
    padding: 3px 16px; font-size: .68rem; color: var(--muted);
    border-bottom: 1px solid var(--border); flex-shrink: 0; min-height: 20px;
  }
  #role-filter {
    background: var(--bg); color: var(--muted); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 8px; font-size: .72rem; cursor: pointer;
    text-transform: none; letter-spacing: 0; font-weight: 400;
  }
  #role-filter:focus { outline: none; border-color: var(--blue); }

  .panel-body { flex: 1; position: relative; overflow: auto; }
  .placeholder {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px; color: var(--muted); font-size: .9rem;
  }
  .placeholder svg { opacity: .3; }

  /* ---- Ficha jugador ---- */
  .card-wrap { padding: 14px 16px; }
  .player-name { font-size: 1.4rem; font-weight: 700; color: var(--text); margin-bottom: 6px; }

  .badge-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
  .tag {
    display: inline-block; border-radius: 4px; padding: 2px 8px; font-size: .72rem;
    border: 1px solid var(--border); background: var(--bg);
  }
  .tag-team   { color: var(--blue);   border-color: #1c3a5e; background: #0d1e30; }
  .tag-agent  { color: var(--green);  border-color: #1c3d1e; background: #0d200f; }
  .tag-tourney{ color: var(--muted); }

  .stats-grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 8px; }
  .stats-grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 12px; }
  .stat-box {
    background: var(--bg); border-radius: 8px; padding: 9px 6px; text-align: center;
    cursor: help; transition: border-color .15s; border: 1px solid transparent;
  }
  .stat-box:hover { border-color: var(--border); }
  .stat-val { font-size: 1.2rem; font-weight: 700; }
  .stat-lbl { font-size: .65rem; color: var(--muted); margin-top: 2px; line-height: 1.2; }

  .section-title {
    font-size: .72rem; font-weight: 600; color: var(--muted);
    letter-spacing: .06em; text-transform: uppercase; margin: 10px 0 5px;
  }
  .mini-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: .8rem; }
  .mini-bar-label { width: 26px; color: var(--muted); text-align: right; flex-shrink: 0; }
  .mini-bar-track { flex: 1; background: var(--border); border-radius: 3px; height: 8px; }
  .mini-bar-fill  { height: 8px; border-radius: 3px; }
  .mini-bar-count { color: var(--muted); font-size: .75rem; min-width: 28px; }

  .tourney-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }

  /* ---- Tabla comparativa ---- */
  .comp-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
  .comp-table th { color: var(--muted); font-weight: 600; padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .comp-table td { padding: 6px 8px; border-bottom: 1px solid #1e242c; }
  .comp-table tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; background: var(--bg); border-radius: 4px; padding: 2px 7px; font-size: .72rem; color: var(--blue); border: 1px solid var(--border); }

  #loading { position: fixed; inset: 0; background: rgba(13,17,23,.88); display: flex; align-items: center; justify-content: center; z-index: 999; font-size: 1rem; color: var(--muted); flex-direction: column; gap: 10px; }
  #loading.hidden { display: none; }
</style>
</head>
<body>

<div id="loading">Cargando datos PCA…</div>

<header>
  <h1>VCT 2025 &#9670; Data Dashboard</h1>
  <span id="status-bar">Haz clic en un punto para explorar un jugador. <kbd>Ctrl+clic</kbd> para comparar varios.</span>
  <button id="clear-btn" onclick="clearSelection()">Limpiar selección</button>
</header>

<div class="grid">
  <div class="panel" id="panel-a1">
    <div class="panel-title">
      <span>Mapa PCA — Jugadores</span>
      <select id="role-filter" onchange="onRoleFilterChange()">
        <option value="0">Todos los roles</option>
        <option value="1">Duelistas</option>
        <option value="2">Iniciadores</option>
        <option value="3">Controladores</option>
        <option value="4">Centinelas</option>
      </select>
    </div>
    <div id="variance-info"></div>
    <div class="panel-body" id="plot-pca"></div>
  </div>

  <div class="panel" id="panel-a2">
    <div class="panel-title" id="a2-title">Importancia de variables</div>
    <div class="panel-body" id="plot-attr"></div>
  </div>

  <div class="panel" id="panel-a3">
    <div class="panel-title">Ficha del jugador</div>
    <div class="panel-body" id="ficha-content">
      <div class="placeholder">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        Selecciona un jugador en el mapa PCA
      </div>
    </div>
  </div>

  <div class="panel" id="panel-a4">
    <div class="panel-title">Radar de métricas</div>
    <div class="panel-body" id="plot-radar">
      <div class="placeholder">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5"/></svg>
        Selecciona un jugador en el mapa PCA
      </div>
    </div>
  </div>
</div>

<script>
const API    = "http://localhost:5000/api";
const COLORS = ["#EF5350","#42A5F5","#66BB6A","#FFA726","#AB47BC","#26C6DA","#EC407A","#8D6E63"];
const DARK   = { paper_bgcolor:"#161B22", plot_bgcolor:"#0D1117", font:{ color:"#FFFFFF", size:11 } };
const MARGIN = { l:50, r:20, t:30, b:50 };

const ROLE_COLORS = {
  1: "#EF5350",
  2: "#42A5F5",
  3: "#AB47BC",
  4: "#66BB6A",
};
const ROLE_META = [
  { id:1, name:"Duelista",    color:"#EF5350" },
  { id:2, name:"Iniciador",   color:"#42A5F5" },
  { id:3, name:"Controlador", color:"#AB47BC" },
  { id:4, name:"Centinela",   color:"#66BB6A" },
];

const FEATURE_LABELS_ES = {
  "Rating":                         "Rating Global",
  "Average Combat Score":           "Puntaje de Combate (ACS)",
  "Kills Per Round":                "Kills por Ronda",
  "Average Damage Per Round":       "Daño por Ronda (ADR)",
  "Kill, Assist, Trade, Survive %": "Consistencia (KAST%)",
  "First Kills Per Round":          "Primera Kill por Ronda",
  "First Deaths Per Round":         "Primera Muerte por Ronda",
  "Headshot %":                     "Precisión (Headshot%)",
  "Assists Per Round":              "Asistencias por Ronda",
  "2k":                             "Doble Kills",
  "3k":                             "Triple Kills",
  "4k":                             "Cuádruple Kills",
  "Spike Plants":                   "Bombas Plantadas",
  "Spike Defuses":                  "Bombas Desactivadas",
  "1v1":                            "Clutch 1 vs 1",
  "1v2":                            "Clutch 1 vs 2",
  "Econ":                           "Economía",
  "rating_attack":                  "Rating Atacando",
  "rating_defend":                  "Rating Defendiendo",
  "rating_both":                    "Rating General (Ambos)",
  "attack_vs_defend":               "Diferencia Ataque vs Defensa",
  "acs_attack":                     "ACS Atacando",
  "acs_defend":                     "ACS Defendiendo",
  "num_agents":                     "Variedad de Agentes",
  "agent_role":                     "Rol del Agente",
};

const STAT_TOOLTIPS = {
  "Rating":   "Nota global de rendimiento (promedio VCT = 1.0)",
  "ACS":      "Average Combat Score: puntaje de combate por ronda",
  "Kills/R":  "Kills promedio por ronda jugada",
  "ADR":      "Daño promedio por ronda",
  "KAST%":    "% de rondas con Kill, Assist, Trade o Survive",
  "FK/R":     "First Kills por ronda: primera eliminación de la ronda",
  "FD/R":     "First Deaths por ronda: primera muerte de la ronda",
  "HS%":      "Porcentaje de disparos en la cabeza",
};

let pcaData          = [];
let explainedVariance = [0, 0];
let loadings         = [];
let selected         = [];
let activeRoleFilter = 0;

// ─── Init ────────────────────────────────────────────────────────────────────
async function init() {
  const [pca, ld] = await Promise.all([
    fetch(`${API}/pca`).then(r => r.json()),
    fetch(`${API}/pca/loadings`).then(r => r.json()),
  ]);
  pcaData           = pca.points;
  explainedVariance = pca.explained_variance;
  loadings          = ld;
  document.getElementById("loading").classList.add("hidden");
  updateVarianceInfo();
  renderPCA();
  renderVarianceImportance();
}

// ─── Variance info bar ────────────────────────────────────────────────────────
function updateVarianceInfo() {
  const p1  = (explainedVariance[0] * 100).toFixed(1);
  const p2  = (explainedVariance[1] * 100).toFixed(1);
  const tot = ((explainedVariance[0] + explainedVariance[1]) * 100).toFixed(1);
  document.getElementById("variance-info").textContent =
    `PC1 explica ${p1}% | PC2 explica ${p2}% | Total: ${tot}% de la varianza del dataset`;
}

// ─── A1 – Scatter PCA (colores por rol) ─────────────────────────────────────
function renderPCA() {
  const filtered = activeRoleFilter === 0
    ? pcaData
    : pcaData.filter(d => d.agent_role === activeRoleFilter);

  // Size by rating
  const ratings = filtered.map(d => d.rating ?? 1.0);
  const mn = Math.min(...ratings), mx = Math.max(...ratings);
  const sizeOf = r => (mx === mn) ? 13 : 6 + ((r - mn) / (mx - mn)) * 14;

  const rolesToShow = activeRoleFilter === 0 ? ROLE_META : ROLE_META.filter(r => r.id === activeRoleFilter);

  const traces = rolesToShow.map(role => {
    const rd = filtered.filter(d => d.agent_role === role.id);
    return {
      type: "scatter", mode: "markers", name: role.name,
      x: rd.map(d => d.pc1),
      y: rd.map(d => d.pc2),
      text: rd.map(d =>
        `<b>${d.player}</b><br>${d.team}<br>Rol: ${d.role_name}<br>Rating: ${fmt(d.rating)}<br>${d.tournament}`
      ),
      hovertemplate: "%{text}<extra></extra>",
      customdata: rd.map(d => d.player),
      marker: {
        color: role.color,
        size:  rd.map(d => {
          const s = sizeOf(d.rating ?? 1.0);
          return selected.includes(d.player) ? Math.max(s, 18) : s;
        }),
        line: rd.map(d => selected.includes(d.player)
          ? { color:"#FFFFFF", width:2 }
          : { color:"rgba(0,0,0,0.4)", width:0.5 }
        ),
        opacity: 0.85,
      },
    };
  });

  Plotly.newPlot("plot-pca", traces, {
    ...DARK, margin: MARGIN,
    xaxis: { title:"PC1", gridcolor:"#21262D", zeroline:false },
    yaxis: { title:"PC2", gridcolor:"#21262D", zeroline:false },
    legend: { bgcolor:"transparent", font:{ size:10 } },
    dragmode: "pan", hovermode: "closest",
  }, { responsive:true, displayModeBar:false });

  document.getElementById("plot-pca").on("plotly_click", evData => {
    const name = evData.points[0].customdata;
    const ctrl = evData.event.ctrlKey || evData.event.metaKey;
    if (ctrl) { if (!selected.includes(name)) selected.push(name); }
    else       { selected = [name]; }
    renderPCA();
    fetchAndRender();
  });
}

function onRoleFilterChange() {
  activeRoleFilter = parseInt(document.getElementById("role-filter").value);
  renderPCA();
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function normArr(arr, lo, hi) {
  const mn = Math.min(...arr), mx = Math.max(...arr);
  if (mx === mn) return arr.map(() => (lo + hi) / 2);
  return arr.map(v => lo + ((v - mn) / (mx - mn)) * (hi - lo));
}
function fmt(v, d=2)  { return (v != null && !isNaN(+v)) ? (+v).toFixed(d) : "0.00"; }
function fmtPct(v)    { return (v != null && !isNaN(+v)) ? (v * 100).toFixed(1) + "%" : "0.0%"; }
function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ─── Fetch & dispatch ─────────────────────────────────────────────────────────
async function fetchAndRender() {
  document.getElementById("status-bar").textContent =
    selected.length === 1
      ? `Jugador: ${selected[0]}`
      : `Comparando: ${selected.join(", ")}`;

  renderAttrAttackDefend();

  if (selected.length === 1) {
    const data = await fetch(`${API}/player/${encodeURIComponent(selected[0])}`).then(r => r.json());
    renderFichaSingle(data);
    renderRadarSingle(data);
  } else {
    const data = await fetch(`${API}/compare`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ players: selected }),
    }).then(r => r.json());
    renderFichaMulti(data);
    renderRadarMulti(data);
  }
}

// ─── A2 Estado 1: Importancia de variables PCA ───────────────────────────────
function renderVarianceImportance() {
  document.getElementById("a2-title").textContent = "Importancia de variables";
  if (!loadings || loadings.length === 0) return;

  const features = loadings.map(l => FEATURE_LABELS_ES[l.feature] || l.feature);
  const pc1Vals  = loadings.map(l => Math.abs(l.pc1));
  const pc2Vals  = loadings.map(l => Math.abs(l.pc2));

  Plotly.newPlot("plot-attr", [
    {
      type:"bar", orientation:"h", name:"PC1 (capacidad ofensiva)",
      x: pc1Vals, y: features,
      marker: { color:"#42A5F5" },
      hovertemplate: "%{y}: %{x:.3f}<extra>PC1</extra>",
    },
    {
      type:"bar", orientation:"h", name:"PC2 (consistencia y rol)",
      x: pc2Vals, y: features,
      marker: { color:"#EF5350", opacity:0.8 },
      hovertemplate: "%{y}: %{x:.3f}<extra>PC2</extra>",
    },
  ], {
    ...DARK,
    margin: { l:190, r:20, t:60, b:40 },
    barmode: "group",
    xaxis: { title:"Peso absoluto en el PCA", gridcolor:"#21262D" },
    yaxis: { autorange:"reversed", gridcolor:"#21262D", tickfont:{ size:9 } },
    title: {
      text: "Variables que más influyen en la separación de jugadores<br>" +
            "<span style='font-size:10px;color:#8B949E'>" +
            "PC1 separa jugadores por capacidad ofensiva | PC2 por consistencia y rol</span>",
      font: { size:12 },
      x: 0.5,
    },
    legend: { bgcolor:"transparent", font:{ size:10 } },
  }, { responsive:true, displayModeBar:false });
}

// ─── A2 Estado 2: Rating Atacando vs Rating Defendiendo ──────────────────────
function renderAttrAttackDefend() {
  document.getElementById("a2-title").textContent = "Ataque vs Defensa";

  const allX = pcaData.map(d => d.rating_attack ?? 0);
  const allY = pcaData.map(d => d.rating_defend ?? 0);
  const vals = [...allX, ...allY].filter(v => !isNaN(v) && v !== 0);
  const minV = (Math.min(...vals) - 0.1).toFixed(2) * 1;
  const maxV = (Math.max(...vals) + 0.1).toFixed(2) * 1;

  const bgX = [], bgY = [], bgText = [];
  pcaData.forEach(d => {
    if (!selected.includes(d.player)) {
      bgX.push(d.rating_attack ?? 0);
      bgY.push(d.rating_defend ?? 0);
      bgText.push(
        `<b>${d.player}</b><br>${d.team}<br>` +
        `Ataque: ${fmt(d.rating_attack)}<br>Defensa: ${fmt(d.rating_defend)}<br>` +
        `Dif: ${fmt(d.attack_vs_defend)}`
      );
    }
  });

  const traces = [
    {
      type:"scatter", mode:"markers", name:"Todos",
      x: bgX, y: bgY, text: bgText,
      hovertemplate: "%{text}<extra></extra>",
      marker: { color:"#30363D", size:5, line:{ color:"#484E57", width:0.5 } },
    },
    {
      type:"scatter", mode:"lines", name:"Equilibrio ataque=defensa",
      x:[minV, maxV], y:[minV, maxV],
      line: { color:"#8B949E", width:1.5, dash:"dash" },
      hoverinfo:"skip", showlegend:false,
    },
  ];

  selected.forEach((name, idx) => {
    const d = pcaData.find(p => p.player === name);
    if (!d) return;
    const col = COLORS[idx % COLORS.length];
    traces.push({
      type:"scatter", mode:"markers+text", name,
      x:[d.rating_attack ?? 0], y:[d.rating_defend ?? 0],
      text:[name],
      textposition:"top center",
      textfont:{ color:col, size:10 },
      customdata:[
        `<b>${name}</b><br>${d.team}<br>` +
        `Ataque: ${fmt(d.rating_attack)}<br>Defensa: ${fmt(d.rating_defend)}<br>` +
        `Diferencia: ${fmt(d.attack_vs_defend)}`
      ],
      hovertemplate:"%{customdata}<extra></extra>",
      marker:{ color:col, size:14, line:{ color:"#fff", width:2 } },
    });
  });

  Plotly.newPlot("plot-attr", traces, {
    ...DARK, margin: MARGIN,
    xaxis: { title:"Rating Atacando", gridcolor:"#21262D", zeroline:false, range:[minV, maxV] },
    yaxis: { title:"Rating Defendiendo", gridcolor:"#21262D", zeroline:false, range:[minV, maxV] },
    title: {
      text: "Rating Atacando vs Rating Defendiendo<br>" +
            "<span style='font-size:10px;color:#8B949E'>" +
            "Sobre la diagonal = mejores defendiendo | Bajo la diagonal = mejores atacando</span>",
      font:{ size:12 }, x:0.5,
    },
    legend:{ bgcolor:"transparent" },
    shapes: [
      { type:"line", x0:minV, x1:maxV, y0:1, y1:1, line:{ color:"#30363D", width:1, dash:"dot" } },
      { type:"line", x0:1, x1:1, y0:minV, y1:maxV, line:{ color:"#30363D", width:1, dash:"dot" } },
    ],
  }, { responsive:true, displayModeBar:false });
}

// ─── A3 single ───────────────────────────────────────────────────────────────
function renderFichaSingle(data) {
  const teamBadges  = (data.teams  || []).map(t => `<span class="tag tag-team">${t}</span>`).join("");
  const agentBadges = (data.agents || []).map(a => `<span class="tag tag-agent">${a}</span>`).join("");

  function sbox(val, label, color, tooltip) {
    const colorStyle = color ? `style="color:${color}"` : "";
    return `<div class="stat-box" title="${tooltip}">
      <div class="stat-val" ${colorStyle}>${val}</div>
      <div class="stat-lbl">${label}</div>
    </div>`;
  }

  const row1 = `<div class="stats-grid-4">
    ${sbox(fmt(data.avg_rating),        "Rating Prom.", "#EF5350", STAT_TOOLTIPS["Rating"])}
    ${sbox(fmt(data.max_rating),        "Rating Máx.",  "#FFA726", "Rating máximo alcanzado en cualquier torneo")}
    ${sbox(fmt(data.min_rating),        "Rating Mín.",  "#42A5F5", "Rating mínimo en cualquier torneo")}
    ${sbox(data.total_tournaments ?? 0, "Torneos",      "",        "Número de torneos en que participó")}
  </div>`;

  const row2 = `<div class="stats-grid-4">
    ${sbox(fmt(data.avg_acs, 0),  "ACS",     "#42A5F5", STAT_TOOLTIPS["ACS"])}
    ${sbox(fmt(data.avg_kpr),     "Kills/R", "",        STAT_TOOLTIPS["Kills/R"])}
    ${sbox(fmt(data.avg_adr, 0),  "ADR",     "",        STAT_TOOLTIPS["ADR"])}
    ${sbox(fmtPct(data.avg_kast), "KAST%",   "#66BB6A", STAT_TOOLTIPS["KAST%"])}
  </div>`;

  const row3 = `<div class="stats-grid-3">
    ${sbox(fmt(data.avg_fkr),         "FK/R", "#66BB6A", STAT_TOOLTIPS["FK/R"])}
    ${sbox(fmt(data.avg_fdr),         "FD/R", "#EF5350", STAT_TOOLTIPS["FD/R"])}
    ${sbox(fmtPct(data.avg_headshot), "HS%",  "",        STAT_TOOLTIPS["HS%"])}
  </div>`;

  let killsHtml = "";
  if (data.kills_stats) {
    const ks   = data.kills_stats;
    const vals = { "2k":ks["2k"]||0, "3k":ks["3k"]||0, "4k":ks["4k"]||0, "5k":ks["5k"]||0 };
    const maxK = Math.max(...Object.values(vals), 1);
    const barColors = { "2k":"#42A5F5","3k":"#66BB6A","4k":"#FFA726","5k":"#EF5350" };
    killsHtml = `<div class="section-title">Multi-kills (acumulado)</div>`;
    for (const [k, v] of Object.entries(vals)) {
      const pct = (v / maxK * 100).toFixed(0);
      killsHtml += `<div class="mini-bar-row">
        <span class="mini-bar-label">${k}</span>
        <div class="mini-bar-track"><div class="mini-bar-fill" style="width:${pct}%;background:${barColors[k]}"></div></div>
        <span class="mini-bar-count">${v}</span>
      </div>`;
    }
  }

  const tourneyTags = (data.tournaments || [])
    .map(t => `<span class="tag tag-tourney">${t}</span>`).join("");

  document.getElementById("ficha-content").innerHTML = `<div class="card-wrap">
    <div class="player-name">${data.player || ""}</div>
    <div class="badge-row">${teamBadges}${agentBadges}</div>
    ${row1}${row2}${row3}
    ${killsHtml}
    ${data.tournaments && data.tournaments.length > 0
      ? `<div class="section-title">Torneos</div><div class="tourney-list">${tourneyTags}</div>`
      : ""}
  </div>`;
}

// ─── A3 multi ────────────────────────────────────────────────────────────────
function renderFichaMulti(data) {
  const metrics = ["Rating","Average Combat Score","Kills Per Round","Average Damage Per Round","Kill, Assist, Trade, Survive %","First Kills Per Round","First Deaths Per Round"];
  const labels  = ["Rating","ACS","Kills/R","ADR","KAST%","FK/R","FD/R"];

  const rows = data.map((p, i) => {
    const color = COLORS[i % COLORS.length];
    const cells = metrics.map((m) => {
      let v = p[m];
      if (v == null) return `<td style="color:var(--muted)">–</td>`;
      const disp = m === "Kill, Assist, Trade, Survive %"
        ? (v * 100).toFixed(1) + "%"
        : (+v).toFixed(2);
      return `<td>${disp}</td>`;
    }).join("");
    return `<tr>
      <td><span style="color:${color};font-weight:700">${p.player}</span><br><span class="badge">${p.team}</span></td>
      ${cells}
    </tr>`;
  }).join("");

  document.getElementById("ficha-content").innerHTML =
    `<div class="card-wrap" style="overflow-x:auto">
      <table class="comp-table">
        <thead><tr><th>Jugador</th>${labels.map(l=>`<th>${l}</th>`).join("")}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// ─── A4 single ───────────────────────────────────────────────────────────────
function renderRadarSingle(data) {
  const name    = data.player;
  const METRICS = ["Rating","Average Combat Score","Kills Per Round","Average Damage Per Round","Kill, Assist, Trade, Survive %","First Kills Per Round"];
  const LABELS  = ["Rating","ACS","Kills/R","ADR","KAST","FK/R"];
  const FEATS   = ["avg_rating","avg_acs","avg_kpr","avg_adr","avg_kast","avg_fkr"];

  const normalized = FEATS.map((key, i) => {
    const v   = data[key] ?? 0;
    const arr = pcaData.map(d => d[METRICS[i]] ?? 0);
    const mn  = Math.min(...arr), mx = Math.max(...arr);
    return mx > mn ? Math.max(0, Math.min(1, (v - mn) / (mx - mn))) : 0;
  });

  const realDisp = FEATS.map((key, i) => {
    const v = data[key];
    if (v == null) return "–";
    return i === 4 ? (v * 100).toFixed(1) + "%" : (+v).toFixed(2);
  });

  const theta = [...LABELS, LABELS[0]];
  const r     = [...normalized, normalized[0]];
  const cd    = [...LABELS.map((l,i) => `${l}: ${realDisp[i]}`), `${LABELS[0]}: ${realDisp[0]}`];

  Plotly.newPlot("plot-radar", [{
    type:"scatterpolar", mode:"lines+markers", fill:"toself",
    r, theta, name,
    customdata: cd,
    hovertemplate:`<b>${name}</b><br>%{customdata}<extra></extra>`,
    line:{ color:"#EF5350", width:2 },
    fillcolor:"rgba(239,83,80,0.15)",
    marker:{ color:"#EF5350", size:5 },
  }], {
    ...DARK, margin:{ l:50, r:50, t:40, b:40 },
    polar:{
      bgcolor:"#0D1117",
      radialaxis:{ range:[0,1], gridcolor:"#30363D", tickfont:{size:9}, showticklabels:false },
      angularaxis:{ gridcolor:"#30363D" },
    },
    legend:{ bgcolor:"transparent" },
  }, { responsive:true, displayModeBar:false });
}

// ─── A4 multi ────────────────────────────────────────────────────────────────
function renderRadarMulti(data) {
  const METRICS = ["Rating","Average Combat Score","Kills Per Round","Average Damage Per Round","Kill, Assist, Trade, Survive %","First Kills Per Round"];
  const LABELS  = ["Rating","ACS","Kills/R","ADR","KAST","FK/R"];

  function fmtRadar(v, i) {
    if (v == null) return "–";
    return i === 4 ? (v * 100).toFixed(1) + "%" : (+v).toFixed(2);
  }

  const traces = data.map((p, i) => {
    const vals  = METRICS.map(m => p[m + "_norm"] ?? 0);
    const theta = [...LABELS, LABELS[0]];
    const r     = [...vals, vals[0]];
    const cd    = [...LABELS.map((l,j) => `${l}: ${fmtRadar(p[METRICS[j]], j)}`), `${LABELS[0]}: ${fmtRadar(p[METRICS[0]], 0)}`];
    const rating  = p["Rating"] != null ? (+p["Rating"]).toFixed(2) : "?";
    const legName = `${p.player} (${p.team}) — Rating ${rating}`;
    const col     = COLORS[i % COLORS.length];
    return {
      type:"scatterpolar", mode:"lines+markers", fill:"toself",
      r, theta, name: legName,
      customdata: cd,
      hovertemplate:`<b>${p.player}</b><br>%{customdata}<extra></extra>`,
      line:{ color:col, width:2 },
      fillcolor: hexToRgba(col, 0.1),
      marker:{ color:col, size:5 },
    };
  });

  Plotly.newPlot("plot-radar", traces, {
    ...DARK, margin:{ l:50, r:50, t:40, b:40 },
    polar:{
      bgcolor:"#0D1117",
      radialaxis:{ range:[0,1], gridcolor:"#30363D", tickfont:{size:9}, showticklabels:false },
      angularaxis:{ gridcolor:"#30363D" },
    },
    legend:{ bgcolor:"transparent", font:{size:10} },
  }, { responsive:true, displayModeBar:false });
}
